[pytest]
# 층별 시험 (Docker 계획 D2, 2026-11-25). 표시는 conftest.py 가 폴더로 붙인다.
#   전부 (지금 venv):        python -m pytest
#   core 만 (core venv):     python -m pytest -m "not vision"
#   k3s 레이어 빼고:          python -m pytest -m "not k3s"
markers =
    vision: vision/ 의 시험 — requirements/vision-gpu.txt (또는 vision-cpu.txt) 가 있어야 다 돈다
    k3s: orchestrator/ (k3s 레이어) 의 시험 — kubectl 없이 가짜로 돈다
norecursedirs = .* venv .venv build dist *.egg node_modules external models stream_data state result_files
