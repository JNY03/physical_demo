# model_registry.yaml — 비전 선택지 · 단서 · 모델을 정의하는 **한 파일** (2026-11-24)
#
# 모델을 늘리거나 바꿀 때 이 파일을 고친다. 런처 · 카탈로그(vision/cue_catalog.py) · 자원 배치가 모두 여기를 읽는다.
# 이 파일은 「무엇이 있고, 어디에 쓰이며, 얼마나 드는가」만 담는다. 임계값 · 입력 크기 같은 모델 매개변수는 아래
# 설정 파일들에 둔다.
#
# ── 설정 파일 위치 (저장소 기준 상대 경로) ─────────────────────────────────────────
#   vision/model_registry.yaml   이 파일 — 선택지 · 단서 · 모델 · GPU 어림
#   vision/vision_config.yaml    모델별 매개변수와 가중치 경로 (models.<선택지>), 기기별 시야각 (devices)
#   vision/assets/targets/*.json 지정 클래스 탐지의 대상과 대상별 기본 단서 (targeted)
#   vision/assets/hazard_cues.json  river 판정 단서의 무게 · 공식
#   tools/launcher/launcher.ps1  런처 (Windows). 바꾼 뒤 C:\Users\<사용자>\DataStreamLauncher\ 에 복사한다
#
# ── 설치 위치 ──────────────────────────────────────────────────────────────────
#   venv       venv/ (저장소 안. 이 기기는 /home/khw67/data_stream/venv). 서버 · 비전 · 런처가 모두 이것을 쓴다
#              패키지:  venv/bin/pip install <패키지>==<버전>   →   requirements.txt 에 같은 줄을 더한다
#   가중치      models/                 (git 에 올리지 않음. 파일 목록은 아래 models.<키>.files)
#   외부 코드   external/<저장소>        (UniDepth · AerialMetric 처럼 pip 로 안 되는 것)
#   HF 캐시     ~/.cache/huggingface/hub (from_pretrained 로 받는 것. 비전은 HF_HUB_OFFLINE=1 로 돈다)
#
# ── 모델을 추가하는 순서 ──────────────────────────────────────────────────────────
#   1. 패키지를 venv 에 설치하고 requirements.txt 에 적는다. 가중치는 models/ 나 external/ 에 둔다
#   2. 아래 models 에 키를 하나 더한다 (files · gpu_mb · device · packages)
#   3. 단서로 쓰면 cues 에, 새 선택지면 options 에 더한다. 단서의 needs · 선택지의 cue_models 에 모델 키를 적는다
#   4. 매개변수는 vision_config.yaml models.<선택지> 에 둔다. 새 선택지는 vision/vision_infer.py 에 실행 코드가 있어야 한다
#   5. 확인: venv/bin/python vision/cue_catalog.py --json   (런처가 읽는 것과 같다)
#
# gpu_mb 는 **측정값이 아니라 배치 계산용 어림값**이다. 실측은 실행 중에 기록되어 이 값을 대신한다.

#: 비전 프로세스 하나의 기본 GPU 메모리 (torch · CUDA 컨텍스트)
base_gpu_mb: 400
#: torch 예약량에 잡히지 않는 CUDA 컨텍스트 몫 (MB). WSL 의 nvidia-smi 는 프로세스별 GPU 메모리를 [N/A] 로 내서
#: 실측 GPU 사용량 = torch 예약 최대치 + 이 값 으로 센다. 2026-11-24 RTX 4050 실측: 기기 증가분 469 − torch 334 = 135 → 150
gpu_context_mb: 150

#: 런처의 비전 선택지 — 순서대로 런처에 보인다
#:   kind      detect(검출) | depth(깊이)
#:   p90_ms    실측이 없을 때 배치에 쓰는 한 장 처리 시간 p90 (ms), 해상도 구간 s ≤640 · m ≤1280 · l ≤1920 · xl.
#:             기기_모델_자원표 5장 실측 p90 (2026-11-24, RTX 4050). 잰 적 없는 칸은 옆 칸에서 크게 어림했다
#:   gpu_mb    프로세스에 더해지는 어림값. targeted 는 고른 단서의 모델 합(cues.*.needs)으로 따로 센다
#:   cue_models  쓰는 단서 유형 → 그 단서가 쓰는 모델 키. targeted 는 cues 구역 전체가 그 목록이다
options:
  yoloe:
    shown: yoloe
    kind: detect
    gpu_mb: 900
    p90_ms: {s: 110, m: 135, l: 140, xl: 510}
    cue_models:
      class: [yoloe_pf_l]
  river:
    shown: river
    kind: detect
    gpu_mb: 2400
    p90_ms: {s: 1230, m: 1210, l: 1590, xl: 1610}
    cue_models:                         # 판정 무게는 vision/assets/hazard_cues.json decision.weights
      class: [yoloe_text, yoloe_free]   # 텍스트 arm + prompt-free arm
      semantic: [clip_fp32]             # CLIP 글 설명
      match: [clip_fp32]                # CLIP 기준 사진 유사도
      shape: []                         # 분할 마스크 모양 (탐지기 마스크에서 잰다)
      material: []                      # 색 · 채도 규칙
      structure: []                     # 부탄 형상 규칙
      distance: [depth]                 # 거리 (UniDepth vitb14, 주기적으로)
  targeted:
    shown: 지정 클래스 탐지
    kind: detect
    gpu_mb: 0
    p90_ms: {s: 420, m: 650, l: 900, xl: 1300}      # l · xl 은 잰 적 없음 (m 에서 어림)
    cue_models: targeted                # = 아래 cues 구역 (needs 가 모델 키)
  unidepth:
    shown: unidepth
    kind: depth
    gpu_mb: 1500
    p90_ms: {s: 370, m: 400, l: 390, xl: 650}
    cue_models:
      distance: [unidepth_l]
  moge2_aerial:
    shown: moge2_aerial
    kind: depth
    gpu_mb: 1500
    p90_ms: {s: 490, m: 480, l: 500, xl: 500}       # l 은 잰 적 없음
    cue_models:
      distance: [moge2_aerial]

#: 지정 클래스 탐지(targeted)의 단서. 이 순서대로 런처에 보인다
#:   label     런처(한글)        label_en  영상 · 웹 카드(영어)
#:   role      기본 역할 — score 점수 · gate 필수 · veto 거부 · cond 조건(거리 신뢰) · on 켜기만 · local 국소 축
#:   roles     허용 역할          weight    기본 무게 (score 일 때)
#:   needs     쓰는 모델 키 (models). ovd = YOLO-World · Grounding DINO 중 쓸 수 있는 것, depth = 거리 모델
#:   requires  대상 파일에 있어야 하는 칸 (하나라도 있으면 됨)
#:   detector  이 단서를 쓸 수 있는 탐지기 종류 (yoloe_text | trained)
cues:
  class:         {label: 탐지기, label_en: detector, role: score, roles: [score], weight: 0.50, needs: [], requires: [], detector: [yoloe_text, trained]}
  free_arm:      {label: 후보 넓히기, label_en: wider candidates, role: "on", roles: ["on"], weight: 0.0, needs: [yoloe_free], requires: [free_vocab], detector: [yoloe_text]}
  semantic:      {label: 글 설명, label_en: description, role: score, roles: [score, gate], weight: 0.20, needs: [clip], requires: [], detector: [yoloe_text, trained]}
  dict_features: {label: 특징 사전, label_en: features, role: score, roles: [score, gate], weight: 0.20, needs: [clip], requires: [features], detector: [yoloe_text, trained]}
  shape:         {label: 형상, label_en: shape, role: score, roles: [score, gate], weight: 0.10, needs: [], requires: [shape, size_mm], detector: [yoloe_text]}
  colour:        {label: 색상, label_en: colour, role: score, roles: [score, gate], weight: 0.15, needs: [], requires: [colours], detector: [yoloe_text, trained]}
  ovd_pair_iou:  {label: OVD 짝 IoU, label_en: OVD pair IoU, role: gate, roles: [gate], weight: 0.0, needs: [ovd], requires: [pair_iou_min], detector: [yoloe_text]}
  clip_colour:   {label: CLIP 색, label_en: CLIP colour, role: gate, roles: [gate, score], weight: 0.10, needs: [clip], requires: [clip_colour], detector: [yoloe_text, trained]}
  clip_shape:    {label: CLIP 모양, label_en: CLIP shape, role: gate, roles: [gate, score], weight: 0.10, needs: [clip], requires: [clip_shape], detector: [yoloe_text, trained]}
  saturation:    {label: 채도, label_en: saturation, role: gate, roles: [gate], weight: 0.0, needs: [], requires: [saturation], detector: [yoloe_text, trained]}
  parts:         {label: 부분, label_en: parts, role: local, roles: [local], weight: 0.0, needs: [yoloe_text], requires: [parts], detector: [yoloe_text]}
  hue:           {label: 색상 H, label_en: hue, role: gate, roles: [gate], weight: 0.0, needs: [], requires: [hue], detector: [yoloe_text, trained]}
  aspect:        {label: 종횡비, label_en: aspect, role: gate, roles: [gate, score], weight: 0.10, needs: [], requires: [aspect, trained], detector: [yoloe_text, trained]}
  ground:        {label: 바닥 위치, label_en: ground, role: gate, roles: [gate], weight: 0.0, needs: [], requires: [trained], detector: [trained]}
  height:        {label: 높이 측정, label_en: height, role: cond, roles: [cond], weight: 0.0, needs: [], requires: [trained], detector: [trained]}
  calibration:   {label: 거리 검증 범위, label_en: calibration, role: cond, roles: [cond], weight: 0.0, needs: [], requires: [trained], detector: [trained]}
  size_veto:     {label: 크기 거부, label_en: size veto, role: veto, roles: [veto], weight: 0.0, needs: [depth], requires: [size_mm], detector: [yoloe_text, trained]}
  lookalike:     {label: 닮은꼴 감점, label_en: look-alike, role: "on", roles: ["on"], weight: 0.0, needs: [clip], requires: [confusers], detector: [yoloe_text, trained]}

#: CPU 작업 — 오케스트레이터가 파이(k3s) 또는 data_stream 기기에 둔다 (placement/1)
#:   cpu_m · mem_mb  requests (limits 는 2배)       roles  둘 수 있는 노드 역할 (gpu = data_stream 기기)
#:   frame_kb · fps · proc_ms  네트워크 비용 계산용 (장당 전송 시간 > 처리 시간이면 그 노드에 두지 않는다)
#:   placement  any | measured (measured 는 노드별 비교 측정이 기억에 있어야 옮긴다 — 없으면 data_stream 기기)
#:   image · command  k3s 파드 (image 가 null 이면 파이에 못 둔다 — Docker 단계에서 만든다)
#:   local_command  data_stream 기기에서 돌릴 때 (저장소 기준)
cpu_tasks:
  cam360_slice:
    note: 360 파노라마를 90도 화면으로 자른다 (e2p/slice360_live.py). camera360 은 보류(2026-11-24) — 비교 측정 전
    cpu_m: 1000
    mem_mb: 400
    roles: [gpu, sensor]
    frame_kb: 970
    fps: 3
    proc_ms: 120
    placement: measured
    image: null
    local_command: [venv/bin/python, e2p/slice360_live.py]

#: targeted 밖 선택지(river 등)의 단서 유형 이름 (런처 설명용). targeted 단서는 위 label 을 쓴다
cue_type_labels: {match: 기준 사진 유사도, material: 재질 규칙, structure: 구조 규칙, distance: 거리}

#: 카드에만 나오는 단서 아닌 줄의 영어 이름 (단서가 아니라 판정 요약 줄)
card_rows_en: {distance: distance, axes: axes, track: track}

#: 구성 모델. 키는 단서의 needs · 선택지의 cue_models 가 가리킨다
#:   files     있어야 쓸 수 있는 파일 (저장소 기준 상대 경로 · ~ 허용). 비어 있으면 늘 쓸 수 있음
#:   files_key 사용 가능 판정에 쓰는 이름이 키와 다를 때 (vision_config models.targeted.files 와 같은 이름)
#:   gpu_mb    더해지는 GPU 어림값 (MB)       device  gpu | cpu
#:   packages  venv 에 있어야 하는 패키지 (requirements.txt 와 맞춘다)
models:
  yoloe_pf_l:
    note: YOLOE-11l-seg prompt-free (내장 어휘 4585종) — yoloe 선택지
    files: [models/yoloe-11l-seg-pf.pt]
    device: gpu
    packages: [ultralytics]
  yoloe_text:
    note: YOLOE-11l-seg 텍스트 프롬프트 + MobileCLIP 텍스트 인코더
    files: [models/yoloe-11l-seg.pt, models/mobileclip_blt.ts]
    gpu_mb: 900
    device: gpu
    packages: [ultralytics]
  yoloe_free:
    note: YOLOE-11s-seg prompt-free — 후보 넓히기 arm
    files: [models/yoloe-11s-seg-pf.pt]
    gpu_mb: 500
    device: gpu
    packages: [ultralytics]
  clip:
    note: CLIP ViT-B/32 ONNX 양자화본 (글 설명 · 특징 · 색 · 모양 · 닮은꼴)
    files: [models/clip-vit-base-patch32/onnx/vision_model_quantized.onnx,
            models/clip-vit-base-patch32/onnx/text_model_quantized.onnx,
            models/clip-vit-base-patch32/onnx/tokenizer_dictionary.json]
    gpu_mb: 350
    device: gpu
    packages: [onnxruntime-gpu]
  clip_fp32:
    note: CLIP ViT-B/32 ONNX fp32 — river 위험물 확인 (GPU 19.5 ms)
    files: [models/clip-vit-base-patch32/onnx/vision_model.onnx]
    device: gpu
    packages: [onnxruntime-gpu]
  yolo_world:
    note: YOLOv8s-worldv2 + CLIP — OVD 동의
    files: [models/yolov8s-worldv2.pt, models/clip/ViT-B-32.pt]
    gpu_mb: 500
    device: gpu
    packages: [ultralytics, clip]
  grounding_dino:
    note: Grounding DINO tiny — OVD 동의 (그 근거를 선언한 대상을 고를 때만)
    files_key: gdino
    gpu_mb_alias: [gdino]
    files: [models/grounding-dino-tiny/config.json, models/grounding-dino-tiny/model.safetensors]
    gpu_mb: 1300
    device: gpu
    packages: [transformers]
  depth:
    note: UniDepth V2 ViT-B/14 — 거리 (targeted · river 가 주기적으로)
    files: [~/.cache/huggingface/hub/models--lpiccinelli--unidepth-v2-vitb14, external/UniDepth]
    gpu_mb: 1300
    device: gpu
    packages: [torch]
  unidepth_l:
    note: UniDepth V2 ViT-L/14 — unidepth 선택지 (vision_config models.unidepth.model_name)
    files: [models/unidepth-v2-vitl14, external/UniDepth]
    device: gpu
    packages: [torch]
  moge2_aerial:
    note: MoGe-2 ViT-L + LoRA r=96 (AerialMetric) — moge2_aerial 선택지
    files: [external/AerialMetric/weights/Moge2-Aerial.pt, external/AerialMetric/MoGe]
    device: gpu
    packages: [torch, peft, utils3d]
  trained:
    note: 대상별 학습 가중치 (대상 파일 trained.weight · fit 이 정한다)
    files: []
    gpu_mb: 120
    device: gpu
    packages: [ultralytics]
  reid:
    note: LightGlue + SuperPoint, CLIP — 객체 재식별
    files: [models/lightglue_superpoint/model.safetensors,
            models/clip-vit-base-patch32/onnx/vision_model_quantized.onnx]
    gpu_mb: 700
    device: gpu
    packages: [transformers, onnxruntime-gpu]
