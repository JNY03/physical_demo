  #   realsense)을 긴 변 640/1280/1920/2560 으로 바꿔 구간별로. gpu_mb = CUDA 초기화 뒤 nvidia-smi 증가분(50 MB 단위 올림).
  #   다른 작업과 GPU · CPU 를 나눠 쓰는 중에 쟀다 — p90 은 잡음이 크다(두 번 재 큰 쪽).
  yoloe26_pf_l:
    note: YOLOE-26l-seg prompt-free (내장 어휘 4585종) — yoloe_pf_l(YOLOE-11l) 의 뒤. 같은 프레임(36장, 1280) 장당 검출 10.6 (11l 8.6), 11l 과 상자 일치 F1 0.70 (11s↔11l 도 0.71 — 이름 일치는 어휘 동의어 때문에 어느 짝이든 0.25–0.33). p50 은 11l 과 잡음 안에서 같다(37–60 ms vs 42–57 ms). GPU 306 MB (11l 310)
