  yolo26n_ncnn:
    note: >-
      YOLO26n (COCO 80종) 기기 단 검출 — 라즈베리파이 5 CPU 용 NCNN (기본 yolo26n_ncnn_320, 정확도가 필요하면 _640).
      ONNX end2end(NMS 없음) 도 같이 둔다(onnxruntime 만 있는 곳). 실행기는 혼자 도는 파일(ncnn · numpy · opencv, torch 없음).
      p90_ms 는 **대리 측정**이다 — x86 i7-13700H 의 P코어 4개(taskset 0,2,4,6 · 4스레드), 320 NCNN. 파이 5(A76 4코어)는 더 느리다
      (기기에서 `python3 yolo26n_ncnn.py --model … --images …` 로 다시 잴 것). 같은 대리 조건에서 640 NCNN p90 130–230 ms,
      ONNX 320 · 640 p90 27–54 · 74–135 ms. int8 ONNX(정적 QDQ)는 x86 에서 빠르지 않고(320 p50 22 vs 22 ms) torch 와 일치도가
      떨어져(F1 0.56) 두지 않았다. 내보내기 —
      `YOLO_AUTOINSTALL=False python vision/runners/yolo26n_ncnn.py --export models/yolo26n.pt --sizes 320 640 --out models/yolo26n_ncnn`
      (ultralytics 8.4.170 · ncnn 1.0.20261020 · pnnx 20260526 · onnx 1.23.2 · onnxslim 0.1.99). NCNN 은 같은 판이면 해시까지 같다,
      ONNX 는 메타데이터 날짜 때문에 매번 다르다.
    files: [models/yolo26n_ncnn/yolo26n_ncnn_320/model.ncnn.param, models/yolo26n_ncnn/yolo26n_ncnn_320/model.ncnn.bin]
    device: cpu
    packages: [ncnn, numpy, opencv-python-headless]
    provides: [detect]
    runs_on: [cpu_arm64, cpu_x86]
    size: small
    runner: yolo26n_ncnn:Runner
    config: {model: models/yolo26n_ncnn/yolo26n_ncnn_320, threads: 4, conf: 0.25}       # 실행기 기본값 (load_runner 가 넘긴다)
    license: AGPL-3.0 (Ultralytics)
    p90_ms: {s: 50, m: 55, l: 50, xl: 45}
    source:
    - {path: models/yolo26n.pt, url: https://github.com/ultralytics/assets/releases/download/v8.4.0/yolo26n.pt, sha256: 9b09cc8bf347f0fc8a5f7657480587f25db09b34bf33b0652110fb03a8ad4fef}
    - {path: models/yolo26n_ncnn/yolo26n_ncnn_320/model.ncnn.param, manual: "yolo26n.pt 에서 내보낸다 (note 의 --export 명령)", sha256: 906bfc2faab37ce4f351cd31dd3247e74e1c4c48b65fc2f133bdd477e52a9159}
    - {path: models/yolo26n_ncnn/yolo26n_ncnn_320/model.ncnn.bin, manual: "yolo26n.pt 에서 내보낸다 (note 의 --export 명령)", sha256: 46b25571cb0d1edfba4c977927c37dde751cb9a84438cc3968ca47c96e77d9ed}
    - {path: models/yolo26n_ncnn/yolo26n_ncnn_640/model.ncnn.param, manual: "yolo26n.pt 에서 내보낸다 (note 의 --export 명령)", sha256: 1d224cb99489e996f5b235151e7be1fd802a74950c70d7a99147cb0a3fb46217}
    - {path: models/yolo26n_ncnn/yolo26n_ncnn_640/model.ncnn.bin, manual: "yolo26n.pt 에서 내보낸다 (note 의 --export 명령)", sha256: d4d6cf5b817d1aa7acc2e6d1709b4c7190d7dd796b1925cba27c6372770ed555}
    - {path: models/yolo26n_ncnn/yolo26n_320.onnx, manual: "yolo26n.pt 에서 내보낸다 (end2end ONNX — 해시는 내보낼 때마다 다르다)"}
    - {path: models/yolo26n_ncnn/yolo26n_640.onnx, manual: "yolo26n.pt 에서 내보낸다 (end2end ONNX — 해시는 내보낼 때마다 다르다)"}
  botsort:
    note: >-
      BoT-SORT 트래커 (ultralytics 내장, 가중치 없음) — 스트림마다 따로, 밖에서 만든 검출에 track_id 를 붙인다. bytetrack(VendorTracker)
      과 다른 점은 GMC(전역 움직임 보정, 기본 sparseOptFlow) — 움직이는 카메라용, 프레임을 함께 넘겨야 한다. CPU 실측(검출 7개/장,
      a2 · cam360 연속 240장, i7 4코어): bytetrack p90 1.1 ms · BoT-SORT GMC 끔 0.9 ms · sparseOptFlow 8 / 12 / 21 ms (640/1280/1920).
      ReID 는 선택 — with_reid + reid_model(yolo26n_reid 로컬 경로) 일 때만 켜진다. 순수 파이썬 · numpy · lap · opencv 라
      cpu_arm64 에도 둔다(single_cam_track 기기 단계의 tracker 슬롯이 기기 쪽만 보므로) — 파이에서는 잰 적 없다
    files: []
    device: cpu
    packages: [ultralytics, lap]
    provides: [track]
    runs_on: [gpu, cpu_x86, cpu_arm64]
    runner: botsort:Runner
    config: {reset_gap_s: 2.0, on_untracked: keep, keep_boxes: detection}       # 실행기 기본값 (load_runner 가 넘긴다)
    license: AGPL-3.0 (Ultralytics)
    p90_ms: {s: 8, m: 12, l: 22, xl: 30}
  yolo26n_reid:
    note: YOLO26n ReID 외모 임베딩 (512차원 ONNX) — botsort with_reid 일 때만 쓴다. 이름만 주면 ultralytics 가 받으러 나가므로 로컬 경로로 준다. BoT-SORT 에 켜면 장당(검출 7개) p90 이 CPU 에서 ~100 ms 늘어난다. onnxruntime CUDA 로 돌려도 빠르지 않았다(검출 수마다 묶음 크기가 바뀌어 p90 110–206 ms) — CPU 에 둔다
    files: [models/yolo26n-reid.onnx]
    device: cpu
    packages: [onnxruntime-gpu]
    provides: [embed]
    runs_on: [cpu_x86, gpu]
    license: AGPL-3.0 (Ultralytics)
    p90_ms: {s: 100, m: 95, l: 100, xl: 100}
    source:
    - {path: models/yolo26n-reid.onnx, url: https://github.com/ultralytics/assets/releases/download/v8.4.0/yolo26n-reid.onnx, sha256: 8529c383197ae4c468eda535d1b165f8b4162cf17bf5fbcff49c7cb6455bc0bb}
