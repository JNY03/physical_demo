# model_registry.yaml — 비전 선택지 · 단서 · 모델을 정의하는 **한 파일** (2026-11-24)
#
# 모델을 늘리거나 바꿀 때 이 파일을 고친다. 런처 · 카탈로그(vision/cue_catalog.py) · 자원 배치가 모두 여기를 읽는다.
# 이 파일은 「무엇이 있고, 어디에 쓰이며, 얼마나 드는가」만 담는다. 임계값 · 입력 크기 같은 모델 매개변수는 아래
# 설정 파일들에 둔다.
#
# ── 설정 파일 위치 (저장소 기준 상대 경로) ─────────────────────────────────────────
#   vision/model_registry.yaml   이 파일 — 선택지 · 단서 · 모델 · GPU 어림
#   vision/vision_config.yaml    모델별 매개변수와 가중치 경로 (models.<선택지>), 기기별 시야각 (devices)
#   vision/assets/targets/*.json 지정 클래스 탐지의 대상과 대상별 기본 단서 (targeted)
#   vision/assets/hazard_cues.json  river 판정 단서의 무게 · 공식
#   tools/launcher/launcher.ps1  런처 (Windows). 바꾼 뒤 C:\Users\<사용자>\DataStreamLauncher\ 에 복사한다
#
# ── 설치 위치 ──────────────────────────────────────────────────────────────────
#   경로 풀이   이 파일과 vision_config.yaml 의 models/… · external/… 상대 경로는 DS_HOME 기준이다
#              (DS_HOME 이 없으면 저장소 루트. ds_resources/settings.py). 절대 경로 · ~ 는 그대로 쓴다
#   Python     저장소의 venv/ 또는 컨테이너의 python. 비전을 띄우는 Python 은 DS_PYTHON (기본: 띄운 쪽과 같은 Python)
#              패키지:  pip install <패키지>==<버전>   →   requirements/<층>.txt 에 같은 줄을 더한다
#   가중치      models/                 (git 에 올리지 않음. 파일 목록은 아래 models.<키>.files)
#   외부 코드   external/<저장소>        (UniDepth · AerialMetric 처럼 pip 로 안 되는 것)
#   HF 캐시     ~/.cache/huggingface/hub (from_pretrained 로 받는 것. 비전은 HF_HUB_OFFLINE=1 로 돈다)
#
# ── 모델을 추가하는 순서 ──────────────────────────────────────────────────────────
#   1. 패키지를 설치하고 requirements/vision-gpu.txt (CPU 로 되면 vision-cpu.txt 도) 에 적는다. 가중치는 models/ 나 external/ 에 둔다
#   2. 아래 models 에 키를 하나 더한다 (files · gpu_mb · device · packages)
#   3. 단서로 쓰면 cues 에, 새 선택지면 options 에 더한다. 단서의 needs · 선택지의 cue_models 에 모델 키를 적는다
#   4. 매개변수는 vision_config.yaml models.<선택지> 에 둔다. 새 선택지는 vision/vision_infer.py 에 실행 코드가 있어야 한다
#   5. 확인: python vision/cue_catalog.py --json   (런처가 읽는 것과 같다)
#
# gpu_mb 는 **측정값이 아니라 배치 계산용 어림값**이다. 실측은 실행 중에 기록되어 이 값을 대신한다.

#: 비전 프로세스 하나의 기본 GPU 메모리 (torch · CUDA 컨텍스트)
base_gpu_mb: 400
#: torch 예약량에 잡히지 않는 CUDA 컨텍스트 몫 (MB). WSL 의 nvidia-smi 는 프로세스별 GPU 메모리를 [N/A] 로 내서
#: 실측 GPU 사용량 = torch 예약 최대치 + 이 값 으로 센다. 2026-11-24 RTX 4050 실측: 기기 증가분 469 − torch 334 = 135 → 150
gpu_context_mb: 150

#: 런처의 비전 선택지 — 순서대로 런처에 보인다
#:   kind      detect(검출) | depth(깊이)
#:   p90_ms    실측이 없을 때 배치에 쓰는 한 장 처리 시간 p90 (ms), 해상도 구간 s ≤640 · m ≤1280 · l ≤1920 · xl.
#:             기기_모델_자원표 5장 실측 p90 (2026-11-24, RTX 4050). 잰 적 없는 칸은 옆 칸에서 크게 어림했다
#:   gpu_mb    프로세스에 더해지는 어림값. targeted 는 고른 단서의 모델 합(cues.*.needs)으로 따로 센다
#:   cue_models  쓰는 단서 유형 → 그 단서가 쓰는 모델 키. targeted 는 cues 구역 전체가 그 목록이다
options:
  yoloe:
    shown: yoloe
    kind: detect
    gpu_mb: 900
    p90_ms: {s: 110, m: 135, l: 140, xl: 510}
    cue_models:
      class: [yoloe_pf_l]
  river:
    shown: river
    kind: detect
    domain: true                        # 도메인 전용 — 모델이 아니라 기능(river_detect)이다. 모델은 cue_models
    gpu_mb: 2400
    p90_ms: {s: 1230, m: 1210, l: 1590, xl: 1610}
    cue_models:                         # 판정 무게는 vision/assets/hazard_cues.json decision.weights
      class: [yoloe_text, yoloe_free]   # 텍스트 arm + prompt-free arm
      semantic: [clip_fp32]             # CLIP 글 설명
      match: [clip_fp32]                # CLIP 기준 사진 유사도
      shape: []                         # 분할 마스크 모양 (탐지기 마스크에서 잰다)
      material: []                      # 색 · 채도 규칙
      structure: []                     # 부탄 형상 규칙
      distance: [depth]                 # 거리 (UniDepth vitb14, 주기적으로)
  targeted:
    shown: 지정 클래스 탐지
    kind: detect
    domain: true                        # 도메인 전용 — 모델이 아니라 기능(targeted_detect)이다. 모델은 cues.*.needs
    gpu_mb: 0
    p90_ms: {s: 420, m: 650, l: 900, xl: 1300}      # l · xl 은 잰 적 없음 (m 에서 어림)
    cue_models: targeted                # = 아래 cues 구역 (needs 가 모델 키)
  unidepth:
    shown: unidepth
    kind: depth
    gpu_mb: 1500
    p90_ms: {s: 370, m: 400, l: 390, xl: 650}
    cue_models:
      distance: [unidepth_l]
  moge2_aerial:
    shown: moge2_aerial
    kind: depth
    gpu_mb: 1500
    p90_ms: {s: 490, m: 480, l: 500, xl: 500}       # l 은 잰 적 없음
    cue_models:
      distance: [moge2_aerial]

#: 지정 클래스 탐지(targeted)의 단서. 이 순서대로 런처에 보인다
#:   label     런처(한글)        label_en  영상 · 웹 카드(영어)
#:   role      기본 역할 — score 점수 · gate 필수 · veto 거부 · cond 조건(거리 신뢰) · on 켜기만 · local 국소 축
#:   roles     허용 역할          weight    기본 무게 (score 일 때)
#:   needs     쓰는 모델 키 (models). ovd = YOLO-World · Grounding DINO 중 쓸 수 있는 것, depth = 거리 모델
#:   requires  대상 파일에 있어야 하는 칸 (하나라도 있으면 됨)
#:   detector  이 단서를 쓸 수 있는 탐지기 종류 (yoloe_text | trained)
cues:
  class:         {label: 탐지기, label_en: detector, role: score, roles: [score], weight: 0.50, needs: [], requires: [], detector: [yoloe_text, trained]}
  free_arm:      {label: 후보 넓히기, label_en: wider candidates, role: "on", roles: ["on"], weight: 0.0, needs: [yoloe_free], requires: [free_vocab], detector: [yoloe_text]}
  semantic:      {label: 글 설명, label_en: description, role: score, roles: [score, gate], weight: 0.20, needs: [clip], requires: [], detector: [yoloe_text, trained]}
  dict_features: {label: 특징 사전, label_en: features, role: score, roles: [score, gate], weight: 0.20, needs: [clip], requires: [features], detector: [yoloe_text, trained]}
  shape:         {label: 형상, label_en: shape, role: score, roles: [score, gate], weight: 0.10, needs: [], requires: [shape, size_mm], detector: [yoloe_text]}
  colour:        {label: 색상, label_en: colour, role: score, roles: [score, gate], weight: 0.15, needs: [], requires: [colours], detector: [yoloe_text, trained]}
  ovd_pair_iou:  {label: OVD 짝 IoU, label_en: OVD pair IoU, role: gate, roles: [gate], weight: 0.0, needs: [ovd], requires: [pair_iou_min], detector: [yoloe_text]}
  clip_colour:   {label: CLIP 색, label_en: CLIP colour, role: gate, roles: [gate, score], weight: 0.10, needs: [clip], requires: [clip_colour], detector: [yoloe_text, trained]}
  clip_shape:    {label: CLIP 모양, label_en: CLIP shape, role: gate, roles: [gate, score], weight: 0.10, needs: [clip], requires: [clip_shape], detector: [yoloe_text, trained]}
  saturation:    {label: 채도, label_en: saturation, role: gate, roles: [gate], weight: 0.0, needs: [], requires: [saturation], detector: [yoloe_text, trained]}
  parts:         {label: 부분, label_en: parts, role: local, roles: [local], weight: 0.0, needs: [yoloe_text], requires: [parts], detector: [yoloe_text]}
  hue:           {label: 색상 H, label_en: hue, role: gate, roles: [gate], weight: 0.0, needs: [], requires: [hue], detector: [yoloe_text, trained]}
  aspect:        {label: 종횡비, label_en: aspect, role: gate, roles: [gate, score], weight: 0.10, needs: [], requires: [aspect, trained], detector: [yoloe_text, trained]}
  ground:        {label: 바닥 위치, label_en: ground, role: gate, roles: [gate], weight: 0.0, needs: [], requires: [trained], detector: [trained]}
  height:        {label: 높이 측정, label_en: height, role: cond, roles: [cond], weight: 0.0, needs: [], requires: [trained], detector: [trained]}
  calibration:   {label: 거리 검증 범위, label_en: calibration, role: cond, roles: [cond], weight: 0.0, needs: [], requires: [trained], detector: [trained]}
  size_veto:     {label: 크기 거부, label_en: size veto, role: veto, roles: [veto], weight: 0.0, needs: [depth], requires: [size_mm], detector: [yoloe_text, trained]}
  lookalike:     {label: 닮은꼴 감점, label_en: look-alike, role: "on", roles: ["on"], weight: 0.0, needs: [clip], requires: [confusers], detector: [yoloe_text, trained]}
  # 사람이 올린 기준 사진(zip)의 CLIP 이미지 임베딩과 crop 을 견준다. 임베딩은
  # cue_catalog.attach_reference_images 가 대상 파일 옆 `<대상>.refs.npz` 에 만든다.
  # 사람이 올린 기준 사진과 후보 조각을 CLIP 임베딩으로 견준다 (target_assess 의 REF_SIM_MIN · REF_SPAN).
  # 가장 닮은 몇 장의 평균이 하한(0.70) 이면 50%, +0.10 이면 100%. 못 재면(작은 조각 · 사진 없음) 통과가 아니라 '못 잼'이다.
  # 문턱을 0.99 로 두지 마라 — 양자화 ONNX 는 묶음 크기만 달라져도 코사인이 0.990 까지 흔들린다.
  ref_match:     {label: 기준 사진, label_en: reference photos, role: score, roles: [score, gate, "on"], weight: 0.15, needs: [clip], requires: [reference_images], detector: [yoloe_text, trained]}

#: CPU 작업 — 오케스트레이터가 파이(k3s) 또는 data_stream 기기에 둔다 (placement/1)
#:   cpu_m · mem_mb  requests (limits 는 2배)       roles  둘 수 있는 노드 역할 (gpu = data_stream 기기)
#:   frame_kb · fps · proc_ms  네트워크 비용 계산용 (장당 전송 시간 > 처리 시간이면 그 노드에 두지 않는다)
#:   placement  any | measured (measured 는 노드별 비교 측정이 기억에 있어야 옮긴다 — 없으면 data_stream 기기)
#:   image · command  k3s 파드 (image 가 null 이면 파이에 못 둔다 — Docker 단계에서 만든다)
#:   local_command  data_stream 기기에서 돌릴 때 (저장소 기준)
#:   하트비트 계약 (image 로 파이에 올리는 작업의 의무, M11): 파드는 환경변수 REDIS_URL · UNIT_ID 를 받는다.
#:     작업은 Redis 키 cpu_telemetry:<UNIT_ID> 에 JSON {"ts": <유닉스 초>} 를 CPU_HEARTBEAT_FRESH_S(30초)보다 자주
#:     (예: 10초마다) 쓴다. 그것이 running 의 근거다 — 없으면 starting 에서 넘어가지 않고, running 뒤 60초
#:     (CPU_REPLACE_AFTER_S) 끊기면 다른 노드로 다시 배치된다 (ds_resources/controller.py)
#: 근거가 쓰는 모델 중 **바꿀 수 있는 것** (2026-11-27). 런처 「기능」 단계 근거 표가 고르게 하고, 프로필
#: models.targeted.cue_setup.models 로 비전에 간다. 비전이 실제로 갈아 끼울 수 있는 것만 적는다.
#:   choices   고를 수 있는 모델 키 (models 구역)        multi  여럿을 함께 고를 수 있나
#:   model_id  거리 모델처럼 같은 코드에 가중치만 바꾸는 것 — 모델 키 → 넘길 값 (상대 경로는 DS_HOME 기준)
#: 여기에 없는 근거 모델(clip 등)은 고정이다 — 근거 표에 글로만 보인다
cue_model_choices:
  ovd:   {choices: [yolo_world, grounding_dino], multi: true}
  depth: {choices: [depth, unidepth_l], multi: false,
          model_id: {depth: lpiccinelli/unidepth-v2-vitb14, unidepth_l: models/unidepth-v2-vitl14}}

cpu_tasks:
  cam360_slice:
    note: 360 파노라마를 90도 화면으로 자른다 (e2p/slice360_live.py). camera360 은 보류(2026-11-24) — 비교 측정 전
    cpu_m: 1000
    mem_mb: 400
    roles: [gpu, sensor]
    frame_kb: 970
    fps: 3
    proc_ms: 120
    placement: measured
    image: null
    local_command: [python, e2p/slice360_live.py]   # python = DS_PYTHON (기본: 띄운 쪽과 같은 Python)

#: 기능 계약 (functions/1, 2026-11-25) — 「무엇을 · 어디에서 돌려야 하는가」를 기능마다 선언한다.
#:
#: 왜 더했나: cpu_tasks 에는 중요도 · 마감 · 고정 · 센서 요구를 적는 칸이 없어 「안전 제어는 로봇 안에서만,
#: 1차 추론은 기기, 무거운 모델은 서버」(비전_오케스트레이션_의사결정_스케줄링_261125.md §10)를 코드로 적을 수
#: 없었다. 이 절이 그 계약이다. 읽는 쪽은 ds_resources/functions.py (load · expand · pairs · as_cpu_task).
#: 배치 알고리즘(placement/1)은 아직 이 절을 쓰지 않는다 — 계약을 먼저 정하는 것이 목적이다.
#: cpu_tasks 는 호환을 위해 그대로 두고, 그 작업들은 functions.py 가 단일 단계 기능으로도 읽는다(별칭).
#:
#: 기능마다
#:   pattern      resident     기기 안에 늘 떠 있다 (systemd). 오케스트레이터는 「놓는」 게 아니라 있는지 보고 없으면 알린다
#:                device_only  기기에서만 돈다 (데이터 중력 · 상태). 서버 단계가 있으면 보조다
#:                cascade      기기에서 거르고 서버에서 확인한다. 기기 단계가 없어도 기능은 산다 (품질만 낮춤)
#:                split        한 기능을 기기 · 서버가 나눠 맡는다. 한쪽이 없으면 기능이 안 된다
#:                server_only  서버에서만 돈다
#:                config       값을 만들어 두고 기기가 적용한다 (배치 대상 아님 — 있는지만 본다)
#:                pipeline     받아서 적용하거나 모아서 분석한다 (배치 대상 아님 — 있는지만 본다)
#:   criticality  safety       링크가 끊겨도 돌아야 한다 — 기기 고정 (k3s 우선순위 ds-safety-high)
#:                mission      요청해서 돌리는 임무 작업 (ds-mission)
#:                best_effort  남는 자원으로 (ds-vision-low)
#:   trigger      always · on_activity(움직임 · 변화가 있을 때) · on_request · periodic
#:   note         한 줄 설명. 한국어 이름을 앞에 적는다
#:   forbid       그 쪽에 단계를 두면 안 되는 것 — [device] · [server] (기본 빈 목록). 단계가 있으면 ValueError
#:   stages       {device, server} 중 있는 것만
#:
#: 단계마다 (없으면 기본값)
#:   pin          device | server | none(기본) — 그 쪽에 붙박이라 옮길 수 없다
#:   needs        {arch: arm64|amd64|any(기본), sensors: [camera|imu|lidar|serial](기본 없음),
#:                 accel: none(기본)|gpu|npu, cores: 소수(기본 없음)}
#:   deadline_ms  그 단계가 지켜야 하는 마감 (없으면 null = 마감 없음)
#:   egress_kb    그 단계가 **내보내는** 장당 크기. frame_kb(받는 양)와 다르다 —
#:                1차 거름은 받는 건 크고(압축 프레임) 보내는 건 수십 바이트다
#:   state        stateless(기본) | sticky — sticky 는 노드를 옮기면 상태를 잃는다
#:   optional     참이면 이 단계가 못 놓여도 기능은 산다 (품질만 낮아진다). 기본 거짓
#:   note         그 단계만의 한 줄 (선택)
#:   자원 칸은 cpu_tasks 와 같은 이름 · 같은 뜻을 쓴다:
#:     cpu_m · mem_mb (requests, limits 는 2배) · frame_kb · fps · proc_ms (네트워크 비용) ·
#:     roles (둘 수 있는 노드 역할: gpu · robot · sensor · small) · placement (any | measured) ·
#:     image · command · env (k3s 파드) · local_command (data_stream 기기에서 돌릴 때)
#:   실행체가 아직 없으면 image: null · command: null 이고 note 에 「실행체 없음 — 계약만」이라고 적는다
#:
#: 패턴이 지키는 규칙 (functions.py load 가 ValueError 로 거부한다)
#:   cascade      두 단계 모두 있어야 하고 기기 단계는 optional: true (없으면 품질만 낮춘다)
#:   split        두 단계 모두 있어야 하고 어느 단계도 optional 일 수 없다 (한쪽이 없으면 기능 거절)
#:   device_only  기기 단계 필수. 서버 단계가 있으면 optional: true (보조다)
#:   server_only  서버 단계 필수. 기기 단계가 있으면 optional: true
#:   resident     기기 단계 필수 · pin: device
#:   safety       기기 단계가 있고 pin: device — 안전은 서버로 옮기지 않는다
#:   배치 대상 패턴(device_only · cascade · split · server_only)의 단계는 cpu_m · mem_mb 를 적어야 한다
#:
#: 23줄 표에서 「경로 계획」만 둘로 쪼갰다(로컬 회피는 safety 상주, 전역 경로는 mission 서버) — 그래서 24개다
functions:
  motor_control:
    note: 로봇 모터 제어 — 로봇 안 systemd 상주, 모터 버스를 직접 쥔다. 실행체 없음 — 계약만
    pattern: resident
    criticality: safety
    trigger: always
    forbid: [server]
    stages:
      device:
        pin: device
        needs: {arch: arm64, sensors: [serial], accel: none, cores: 0.5}
        deadline_ms: 10
        egress_kb: 0.2
        cpu_m: 500
        mem_mb: 128
        roles: [robot]
        image: null
        command: null

  emergency_stop:
    note: 긴급정지 · 충돌방지 — 로봇 안 systemd 상주. 링크가 끊겨도 혼자 돈다. 실행체 없음 — 계약만
    pattern: resident
    criticality: safety
    trigger: always
    stages:
      device:
        pin: device
        needs: {arch: arm64, sensors: [camera, serial], accel: none, cores: 0.5}
        deadline_ms: 50
        egress_kb: 0.1
        cpu_m: 400
        mem_mb: 128
        roles: [robot]
        image: null
        command: null
        note: 근접 · 깊이로 스스로 멈춘다. 링크 무관 — k3s 파드로는 이 보장이 안 된다(orchestrator/k3s/priorityclass-safety.yaml)
      server:
        pin: server
        optional: true
        egress_kb: 0.5
        cpu_m: 100
        mem_mb: 128
        roles: [gpu]
        image: null
        command: null
        note: 상태 읽기만 — 서버는 멈추라고 하지 않는다

  sensor_collect:
    note: 센서 데이터 수집 — 기기 systemd 상주로 센서를 읽고, 서버가 모아 저장한다. 실행체 없음 — 계약만
    pattern: resident
    criticality: mission
    trigger: always
    stages:
      device:
        pin: device
        needs: {sensors: [camera, imu], cores: 0.5}
        deadline_ms: 100
        egress_kb: 2
        cpu_m: 400
        mem_mb: 256
        roles: [robot, sensor]
        image: null
        command: null
      server:
        pin: server
        optional: true
        egress_kb: 0
        cpu_m: 500
        mem_mb: 1024
        roles: [gpu]
        image: null
        command: null
        note: 통합 저장 — 없어도 기기는 계속 읽는다

  camera_calibration:
    note: 카메라 캘리브레이션 — 서버가 보정값을 산출하고 기기는 파일 버전을 적용한다. 실행체 없음 — 계약만
    pattern: config
    criticality: mission
    trigger: on_request
    stages:
      device:
        egress_kb: 0.1
        cpu_m: 50
        mem_mb: 64
        roles: [robot, sensor, small, gpu]
        image: null
        command: null
        note: 보정값 적용 — 파일 버전으로 받는다 (vision/vision_config.yaml devices)
      server:
        pin: server
        egress_kb: 4
        cpu_m: 1000
        mem_mb: 1024
        roles: [gpu]
        image: null
        command: null

  video_preprocess:
    note: 영상 전처리 · 압축 — 원본은 카메라 노드에만 있다(데이터 중력). 실행체 없음 — 계약만
    pattern: device_only
    criticality: mission
    trigger: always
    stages:
      device:
        pin: device
        needs: {sensors: [camera], cores: 2.0}
        deadline_ms: 150
        frame_kb: 2700
        egress_kb: 120
        fps: 5
        proc_ms: 120
        cpu_m: 1200
        mem_mb: 400
        roles: [robot, sensor, gpu]
        image: null
        command: null
        note: 파이 5 에는 H.264 하드웨어 인코더가 없다 — 제어와 CPU 를 다투면 해상도 · fps · 화질을 낮춘다 (§10)
      server:
        optional: true
        frame_kb: 120
        egress_kb: 60
        proc_ms: 40
        cpu_m: 1000
        mem_mb: 512
        roles: [gpu]
        image: null
        command: null
        note: 보조 재인코딩 — 저장 · 가시화용

  object_detect:
    options: [yoloe]                    # 모델 선택지 — 모델이 늘면 여기에 더한다. 도메인 전용은 따로 기능으로
    note: 객체 탐지 — 기기에서 int8 320px 로 거르고 서버 고성능 모델이 확인한다
    pattern: cascade
    criticality: mission
    trigger: on_activity
    stages:
      device:
        optional: true
        needs: {sensors: [camera], accel: none, cores: 2.0}
        deadline_ms: 1000
        frame_kb: 120
        egress_kb: 0.05
        fps: 2
        proc_ms: 400
        cpu_m: 1600
        mem_mb: 512
        roles: [robot, sensor, small, gpu]
        placement: measured
        image: null
        command: null
        note: 1~5 fps · 1~2 스레드. 파이마다 성능이 달라 placement 는 measured — 비교 측정 전에는 옮기지 않는다. 실행체 없음 — 계약만
      server:
        needs: {accel: gpu}
        deadline_ms: 500
        frame_kb: 120
        egress_kb: 2
        cpu_m: 500
        mem_mb: 2048
        roles: [gpu]
        image: null
        command: null
        note: options.yoloe 가 맡는다 (GPU Executor 가 띄운다 — image · command 로 올리는 작업이 아니다)

  zeroshot_detect:
    options: [yoloe]
    note: Zero-shot 객체 탐지 — 기기는 사전 등록 프롬프트 임베딩만, 서버가 동적 프롬프트로 정밀하게
    pattern: cascade
    criticality: mission
    trigger: on_request
    stages:
      device:
        optional: true
        needs: {sensors: [camera], cores: 2.0}
        deadline_ms: 1000
        frame_kb: 120
        egress_kb: 0.05
        fps: 1
        proc_ms: 700
        cpu_m: 1200
        mem_mb: 512
        roles: [robot, sensor, small, gpu]
        placement: measured
        image: null
        command: null
        note: 미리 굳힌 프롬프트 임베딩만 — 새 프롬프트는 서버에서. 실행체 없음 — 계약만
      server:
        needs: {accel: gpu}
        deadline_ms: 2000
        frame_kb: 120
        egress_kb: 4
        cpu_m: 500
        mem_mb: 3072
        roles: [gpu]
        image: null
        command: null
        note: options.yoloe 가 맡는다 (GPU Executor 가 띄운다)

  targeted_detect:
    options: [targeted]                 # 도메인 전용 기능 — 모델은 근거(cues)마다 고른다(yoloe_text · yoloe_free · clip · depth …)
    note: 지정 물체 탐지 — 정한 대상을 근거(이름 · 글 설명 · 기준 사진 · 모양 · 재질 · 거리)로 판정한다
    pattern: cascade
    criticality: mission
    trigger: on_request
    stages:
      device:
        optional: true
        needs: {sensors: [camera], cores: 2.0}
        deadline_ms: 1000
        frame_kb: 120
        egress_kb: 0.05
        fps: 1
        proc_ms: 700
        cpu_m: 1200
        mem_mb: 512
        roles: [robot, sensor, small, gpu]
        placement: measured
        image: null
        command: null
        note: 미리 굳힌 프롬프트 임베딩만 — 새 프롬프트는 서버에서. 실행체 없음 — 계약만
      server:
        needs: {accel: gpu}
        deadline_ms: 2000
        frame_kb: 120
        egress_kb: 4
        cpu_m: 500
        mem_mb: 3072
        roles: [gpu]
        image: null
        command: null
        note: options.targeted 가 맡는다 (GPU Executor 가 띄운다)

  river_detect:
    options: [river]                    # 도메인 전용 기능 — 모델은 cue_models(yoloe_text · yoloe_free · clip · depth)
    note: 하천 부유물 탐지 — 물에 떠내려가는 물체를 학습 없이 찾는다
    pattern: cascade
    criticality: mission
    trigger: on_request
    stages:
      device:
        optional: true
        needs: {sensors: [camera], cores: 2.0}
        deadline_ms: 1000
        frame_kb: 120
        egress_kb: 0.05
        fps: 1
        proc_ms: 700
        cpu_m: 1200
        mem_mb: 512
        roles: [robot, sensor, small, gpu]
        placement: measured
        image: null
        command: null
        note: 미리 굳힌 프롬프트 임베딩만 — 새 프롬프트는 서버에서. 실행체 없음 — 계약만
      server:
        needs: {accel: gpu}
        deadline_ms: 2000
        frame_kb: 120
        egress_kb: 4
        cpu_m: 500
        mem_mb: 3072
        roles: [gpu]
        image: null
        command: null
        note: options.river 가 맡는다 (GPU Executor 가 띄운다)

  segmentation:
    options: [yoloe]
    note: Segmentation — 기기 경량 분할로 거르고 서버 Foundation 모델이 맡는다. 실행체 없음 — 계약만
    pattern: cascade
    criticality: best_effort
    trigger: on_request
    stages:
      device:
        optional: true
        needs: {sensors: [camera], cores: 2.0}
        deadline_ms: 2000
        frame_kb: 120
        egress_kb: 8
        fps: 1
        proc_ms: 1200
        cpu_m: 1500
        mem_mb: 512
        roles: [robot, sensor, small, gpu]
        placement: measured
        image: null
        command: null
      server:
        needs: {accel: gpu}
        deadline_ms: 3000
        frame_kb: 120
        egress_kb: 40
        cpu_m: 500
        mem_mb: 4096
        roles: [gpu]
        image: null
        command: null

  depth_estimate:
    options: [unidepth, moge2_aerial]
    note: Depth Estimation — 기기는 상대 깊이로 근거리만 보고, 서버가 정밀 거리 · 다중 시점을 맡는다
    pattern: cascade
    criticality: mission
    trigger: on_activity
    stages:
      device:
        optional: true
        needs: {sensors: [camera], cores: 2.0}
        deadline_ms: 500
        frame_kb: 120
        egress_kb: 1
        fps: 2
        proc_ms: 300
        cpu_m: 1200
        mem_mb: 512
        roles: [robot, sensor, small, gpu]
        placement: measured
        image: null
        command: null
        note: 상대 깊이 · 근거리 판단만 — 거리값으로 쓰지 않는다. 실행체 없음 — 계약만
      server:
        needs: {accel: gpu}
        deadline_ms: 1000
        frame_kb: 120
        egress_kb: 30
        cpu_m: 500
        mem_mb: 2048
        roles: [gpu]
        image: null
        command: null
        note: options.unidepth · moge2_aerial 가 맡는다

  single_cam_track:
    note: 단일 카메라 Tracking — 그 카메라 노드에서 돈다. 궤적은 노드를 옮기면 잃는다(sticky). 실행체 없음 — 계약만
    pattern: device_only
    criticality: mission
    trigger: on_activity
    stages:
      device:
        needs: {sensors: [camera], cores: 1.0}
        deadline_ms: 200
        frame_kb: 120
        egress_kb: 1
        fps: 5
        proc_ms: 80
        state: sticky
        cpu_m: 800
        mem_mb: 256
        roles: [robot, sensor, small, gpu]
        image: null
        command: null
      server:
        optional: true
        deadline_ms: 500
        egress_kb: 1
        cpu_m: 300
        mem_mb: 512
        roles: [gpu]
        image: null
        command: null
        note: 보조 — 끊긴 궤적 이어 붙이기

  multi_cam_track:
    note: 다중 카메라 Tracking — 기기가 특징을 뽑고 서버가 카메라 사이 객체를 잇는다. 실행체 없음 — 계약만
    pattern: split
    criticality: mission
    trigger: on_activity
    stages:
      device:
        needs: {sensors: [camera], cores: 1.0}
        deadline_ms: 200
        frame_kb: 120
        egress_kb: 8
        fps: 5
        proc_ms: 100
        cpu_m: 1000
        mem_mb: 384
        roles: [robot, sensor, small, gpu]
        image: null
        command: null
      server:
        needs: {accel: gpu}
        deadline_ms: 500
        egress_kb: 4
        state: sticky
        cpu_m: 800
        mem_mb: 1024
        roles: [gpu]
        image: null
        command: null
        note: 객체 연결 표를 들고 있다 — 옮기면 잃는다

  reid:
    options: [targeted]
    note: ReID — 기기가 경량 임베딩을 보내고 서버가 유사도 · 증거를 융합한다
    pattern: split
    criticality: mission
    trigger: on_request
    stages:
      device:
        needs: {sensors: [camera], cores: 1.0}
        deadline_ms: 500
        frame_kb: 120
        egress_kb: 2
        fps: 2
        proc_ms: 250
        cpu_m: 1000
        mem_mb: 384
        roles: [robot, sensor, small, gpu]
        placement: measured
        image: null
        command: null
        note: 실행체 없음 — 계약만
      server:
        needs: {accel: gpu}
        deadline_ms: 2000
        egress_kb: 4
        cpu_m: 500
        mem_mb: 1024
        roles: [gpu]
        image: null
        command: null
        note: models.reid (LightGlue + SuperPoint · CLIP) 가 맡는다

  anomaly_detect:
    options: [yoloe]
    note: 이상 탐지 — 기기가 1차로 감지하고 서버가 검증한다. 실행체 없음 — 계약만
    pattern: cascade
    criticality: mission
    trigger: on_activity
    stages:
      device:
        optional: true
        needs: {sensors: [camera, imu], cores: 1.0}
        deadline_ms: 1000
        frame_kb: 120
        egress_kb: 0.1
        fps: 2
        proc_ms: 200
        cpu_m: 800
        mem_mb: 256
        roles: [robot, sensor, small, gpu]
        image: null
        command: null
      server:
        needs: {accel: gpu}
        deadline_ms: 3000
        frame_kb: 120
        egress_kb: 4
        cpu_m: 500
        mem_mb: 2048
        roles: [gpu]
        image: null
        command: null

  slam:
    note: SLAM — 로컬 위치 추정은 기기 붙박이(지도를 들고 있다), 서버는 여러 지도를 합친다. 실행체 없음 — 계약만
    pattern: split
    criticality: mission
    trigger: always
    stages:
      device:
        per_source: false        # 지도는 기기에 하나다 — 카메라 수만큼 늘리지 않는다
        pin: device
        needs: {sensors: [camera, imu], cores: 2.0}
        deadline_ms: 100
        frame_kb: 120
        egress_kb: 1
        fps: 10
        proc_ms: 60
        state: sticky
        cpu_m: 1500
        mem_mb: 512
        roles: [robot, sensor]
        image: null
        command: null
      server:
        pin: server
        deadline_ms: 2000
        egress_kb: 20
        state: sticky
        cpu_m: 1000
        mem_mb: 2048
        roles: [gpu]
        image: null
        command: null

  vlm:
    note: VLM — 상황 분석은 서버 전용. 기기 경량 판은 선택이다. 실행체 없음 — 계약만
    pattern: server_only
    criticality: best_effort
    trigger: on_request
    stages:
      device:
        optional: true
        needs: {sensors: [camera], cores: 2.0}
        egress_kb: 0.5
        frame_kb: 120
        cpu_m: 1000
        mem_mb: 1024
        roles: [sensor, small, gpu]
        placement: measured
        image: null
        command: null
        note: 선택적 경량 판 — 없는 것이 기본이다
      server:
        needs: {accel: gpu}
        frame_kb: 120
        egress_kb: 4
        cpu_m: 500
        mem_mb: 8192
        roles: [gpu]
        image: null
        command: null

  grounding_explain:
    options: [targeted]
    note: 근거 설명 — 기기가 측정값 · 특징을 뽑고 서버가 증거를 모아 자연어로 적는다
    pattern: split
    criticality: best_effort
    trigger: on_request
    stages:
      device:
        needs: {sensors: [camera], cores: 0.5}
        deadline_ms: 500
        frame_kb: 120
        egress_kb: 4
        fps: 1
        proc_ms: 120
        cpu_m: 600
        mem_mb: 256
        roles: [robot, sensor, small, gpu]
        image: null
        command: null
        note: 실행체 없음 — 계약만
      server:
        needs: {accel: gpu}
        egress_kb: 8
        cpu_m: 500
        mem_mb: 4096
        roles: [gpu]
        image: null
        command: null
        note: 증거 통합은 vision/hazard_verify.py · scan_assess.py 의 판정 근거를 쓴다

  motion_forecast:
    note: 객체 이동 예측 — 기기는 단기(다음 몇 프레임), 서버는 장기 · 다중 객체. 실행체 없음 — 계약만
    pattern: cascade
    criticality: mission
    trigger: on_activity
    stages:
      device:
        optional: true
        needs: {cores: 0.5}
        deadline_ms: 200
        egress_kb: 1
        fps: 5
        proc_ms: 30
        cpu_m: 400
        mem_mb: 192
        roles: [robot, sensor, small, gpu]
        image: null
        command: null
      server:
        deadline_ms: 1000
        egress_kb: 8
        cpu_m: 600
        mem_mb: 1024
        roles: [gpu]
        image: null
        command: null

  local_avoidance:
    note: 경로 계획(로컬 회피) — 로봇 안 systemd 상주. 전역 경로(global_path_plan)와 나눈 반쪽이다. 실행체 없음 — 계약만
    pattern: resident
    criticality: safety
    trigger: always
    forbid: [server]
    stages:
      device:
        pin: device
        needs: {arch: arm64, sensors: [camera, lidar], accel: none, cores: 1.0}
        deadline_ms: 50
        egress_kb: 0.5
        cpu_m: 600
        mem_mb: 256
        roles: [robot]
        image: null
        command: null

  global_path_plan:
    note: 경로 계획(전역 경로 · 임무) — 서버에서 긴 경로를 짠다. 로컬 회피가 거부권을 가진다. 실행체 없음 — 계약만
    pattern: server_only
    criticality: mission
    trigger: on_request
    stages:
      server:
        pin: server
        deadline_ms: 2000
        egress_kb: 4
        cpu_m: 1000
        mem_mb: 2048
        roles: [gpu]
        image: null
        command: null

  multi_robot_assign:
    note: 다중 로봇 임무 배정 — 전체 최적화는 서버, 기기는 수락 · 실행만. 실행체 없음 — 계약만
    pattern: server_only
    criticality: mission
    trigger: on_request
    stages:
      device:
        optional: true
        egress_kb: 0.5
        deadline_ms: 500
        cpu_m: 200
        mem_mb: 128
        roles: [robot]
        image: null
        command: null
        note: 수락 · 실행만 — 배정은 하지 않는다
      server:
        pin: server
        deadline_ms: 5000
        egress_kb: 2
        cpu_m: 1000
        mem_mb: 2048
        roles: [gpu]
        image: null
        command: null

  digital_twin:
    note: 디지털 트윈 — 기기가 관측을 발행하고 서버가 전역 상태를 들고 있다. 실행체 없음 — 계약만
    pattern: split
    criticality: best_effort
    trigger: periodic
    stages:
      device:
        egress_kb: 1
        deadline_ms: 1000
        cpu_m: 300
        mem_mb: 192
        roles: [robot, sensor, small, gpu]
        image: null
        command: null
      server:
        pin: server
        egress_kb: 20
        state: sticky
        cpu_m: 1000
        mem_mb: 2048
        roles: [gpu]
        image: null
        command: null

  model_train:
    note: 모델 학습 — 서버 전용. 기기 학습은 금지다(forbid device) — 제어와 다투고 발열로 throttle 된다
    pattern: server_only
    criticality: best_effort
    trigger: on_request
    forbid: [device]
    stages:
      server:
        pin: server
        needs: {arch: amd64, accel: gpu}
        egress_kb: 0
        cpu_m: 2000
        mem_mb: 16384
        roles: [gpu]
        image: null
        command: null
        local_command: [python, vision/train_custom_pe.py]
        note: 지정 클래스 탐지의 대상별 학습은 vision/train_custom_pe.py 가 맡는다

  model_update:
    note: 모델 업데이트 — 서버가 버전을 쥐고 기기가 받아서 적용한다
    pattern: pipeline
    criticality: mission
    trigger: on_request
    stages:
      device:
        egress_kb: 0.1
        cpu_m: 200
        mem_mb: 256
        roles: [robot, sensor, small, gpu]
        image: null
        command: null
        local_command: [python, tools/fetch_models.py]
        note: 받아서 적용 — models.<키>.source 를 tools/fetch_models.py 가 내려받고 해시로 확인한다
      server:
        pin: server
        egress_kb: 0
        cpu_m: 300
        mem_mb: 512
        roles: [gpu]
        image: null
        command: null
        note: 버전 관리 — 이 레지스트리의 rev · commit · sha256 이 그 판이다

  resource_status:
    note: 자원 상태 관리 — 기기가 수집하고 서버가 분석한다. 수집은 이미 node_resource_stream 이 하고 있다
    pattern: pipeline
    criticality: mission
    trigger: periodic
    stages:
      device:
        egress_kb: 0.5
        cpu_m: 100
        mem_mb: 128
        roles: [robot, sensor, small, gpu]
        image: null
        command: null
        note: 수집 — orchestrator/k3s_source.py · ds_resources/probe.py 가 이미 맡는다 (따로 띄우지 않는다)
      server:
        pin: server
        egress_kb: 2
        cpu_m: 200
        mem_mb: 512
        roles: [gpu]
        image: null
        command: null
        note: 분석 — ds_resources/memory.py 의 기억 · p95 가 그 자리다

#: targeted 밖 선택지(river 등)의 단서 유형 이름 (런처 설명용). targeted 단서는 위 label 을 쓴다
cue_type_labels: {match: 기준 사진 유사도, material: 재질 규칙, structure: 구조 규칙, distance: 거리}

#: 카드에만 나오는 단서 아닌 줄의 영어 이름 (단서가 아니라 판정 요약 줄)
card_rows_en: {distance: distance, axes: axes, track: track}

#: 구성 모델. 키는 단서의 needs · 선택지의 cue_models 가 가리킨다
#:   files     있어야 쓸 수 있는 파일 (저장소 기준 상대 경로 · ~ 허용). 비어 있으면 늘 쓸 수 있음
#:   files_key 사용 가능 판정에 쓰는 이름이 키와 다를 때 (vision_config models.targeted.files 와 같은 이름)
#:   gpu_mb    더해지는 GPU 어림값 (MB)       device  gpu | cpu
#:   packages  venv 에 있어야 하는 패키지 (requirements.txt 와 맞춘다)
#:   source    받을 곳 — tools/fetch_models.py 가 읽는다 (가중치 받기, Docker 계획 D3). 항목 하나가 아래 중 하나:
#:               {path, url, sha256}                  URL 의 파일 하나
#:               {path, hf, rev, file, sha256}        HF 저장소(hf: 소유자/이름 · datasets/소유자/이름)의 파일 하나
#:               {path, hf, rev, include, sha256}     HF 파일 여럿을 폴더로 — sha256 은 include 파일들의 manifest
#:               {hf, rev, include, cache: true, …}   HF 캐시에 (from_pretrained(저장소 id) 로 읽는 것)
#:               {path, repo, commit}                 외부 git 저장소를 그 커밋으로 (external/…)
#:               {path, manual, sha256?}              받을 곳이 없다(직접 만든 것) — 안내만, 해시가 있으면 검증
#:             path 는 DS_HOME 기준. rev · commit 은 고정한다(브랜치 이름 금지). 해시: tools/fetch_models.py --hash <경로>
