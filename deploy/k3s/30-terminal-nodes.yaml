# 말단 노드 — 기기마다 하나씩 (DaemonSet)
# ========================================
# **배치를 주소가 아니라 라벨로 정한다.** 어느 기기가 로봇이고 어느 기기가
# 센서인지는 쓰는 사람이 자기 클러스터에서 라벨로 선언한다:
#
#   kubectl label node <이름> physical.io/role=terminal
#   kubectl label node <이름> physical.io/link=go1      # sim | go1 | ep | can | eth
#
# 그래서 이 파일에는 특정 기기 이름이나 주소가 한 줄도 없다. 기기를 바꿔도
# 라벨만 옮기면 되고 매니페스트는 그대로다.
#
# DaemonSet 인 이유: 말단 노드는 **그 기기에서 돌아야** 의미가 있다. Deployment
# 로 두면 스케줄러가 다른 기기에 올려 버리고, 그러면 구동부에 닿지 못한다.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: robot-node
  namespace: physical
  labels: { app: robot-node, tier: terminal }
spec:
  selector:
    matchLabels: { app: robot-node }
  template:
    metadata:
      labels: { app: robot-node, tier: terminal }
    spec:
      nodeSelector:
        physical.io/role: terminal
      # 말단은 클러스터 DNS 를 거치지 않고 브로커를 직접 잡는다. 제어평면과
      # 말단이 다른 네트워크에 있으면 파드 간 오버레이(flannel VXLAN)가 통하지
      # 않아 클러스터 DNS 가 죽는 경우가 있다 — WSL 엣지에서 실측 확인.
      # 브로커를 서비스 이름으로 쓰려면 이 줄을 지우고 ClusterFirst 로 둔다.
      dnsPolicy: Default
      # 구동부는 호스트 네트워크에 걸려 있다(Go1 192.168.123.x, EP RNDIS
      # 192.168.42.2). 포트 매핑이 의미가 없어 호스트망을 그대로 쓴다.
      hostNetwork: true
      terminationGracePeriodSeconds: 20
      containers:
        - name: node
          image: physical-node:latest       # 10-config.yaml 의 physical-images 참조
          imagePullPolicy: IfNotPresent
          command: ["python3", "-m", "robot.robot_node"]
          envFrom:
            - configMapRef: { name: physical-config }
          env:
            - name: HW_ENTITY_TYPE
              value: "robot"
            # **기기마다 달라야 한다.** 같은 id 로 둘이 붙으면 client_id 플래핑
            # 으로 서로를 끊는다. 노드 이름에서 끌어다 쓰면 자동으로 갈린다.
            - name: HW_ENTITY_ID
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: HW_NODE_ID
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            # 기종. 라벨로 선언한 값을 그대로 받는다. 라벨이 없으면 sim 으로
            # 떠서 **SDK 없이도 배포 경로를 먼저 검증**할 수 있다.
            - name: HW_CONTROLLER_LINK
              value: "sim"
          volumeMounts:
            # 단절 구간 보존. 파드가 다시 떠도 남아 있어야 한다.
            - { name: spool, mountPath: /var/lib/hw-node }
            # 기종 SDK 는 이미지에 넣지 않는다 — 호스트에서 빌드한 것을 붙인다.
            - { name: sdk, mountPath: /opt/sdk, readOnly: true }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "1", memory: "512Mi" }
      volumes:
        - name: spool
          hostPath: { path: /var/lib/hw-node, type: DirectoryOrCreate }
        - name: sdk
          hostPath: { path: /opt/sdk, type: DirectoryOrCreate }
---
# 센서·구동기 노드도 **같은 이미지**다. 실행 모듈과 env 만 다르다.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sensor-node
  namespace: physical
  labels: { app: sensor-node, tier: terminal }
spec:
  selector:
    matchLabels: { app: sensor-node }
  template:
    metadata:
      labels: { app: sensor-node, tier: terminal }
    spec:
      nodeSelector:
        physical.io/role: terminal
      dnsPolicy: Default
      terminationGracePeriodSeconds: 20
      containers:
        - name: node
          image: physical-node:latest
          imagePullPolicy: IfNotPresent
          command: ["python3", "-m", "sensor.sensor_node"]
          envFrom:
            - configMapRef: { name: physical-config }
          env:
            - name: HW_ENTITY_TYPE
              value: "sensor"
            - name: HW_ENTITY_ID
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: HW_NODE_ID
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          volumeMounts:
            - { name: spool, mountPath: /var/lib/hw-node }
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
      volumes:
        - name: spool
          hostPath: { path: /var/lib/hw-node-sensor, type: DirectoryOrCreate }
