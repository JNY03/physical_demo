redis:
  host: localhost
  port: 7860
  db: 0
  password: ""        # 실제 값은 환경변수 REDIS_PASSWORD 로 준다 (공개 저장소에 두지 않는다)

streams:
  camera_id: go1_front
  input: camera_stream:go1_front
  output: control_stream:go1_front
  yolo_vis: processed_stream:go1_front
  depth_vis: depth_stream:go1_front
  # 로봇 속도 수신 스트림 (동적 threshold 계산용)
  velocity: velocity_stream:go1_front

runtime:
  use_fp16: true
  num_workers: 1
  vis_fps_limit: 5

image:
  w_half: 464
  h_total: 400
  jpeg_quality: 70

risk:
  # 속도 스트림 수신 실패 시 fallback 값
  near_threshold: 2.0
  mid_threshold: 2.4
  # 동적 threshold 파라미터
  dynamic_threshold:
    enabled: true
    reaction_time: 0.10      # 시스템 반응시간 (초)
    brake_factor: 0.30       # 제동거리 계수 (속도 × 계수 = 제동거리)
    safety_margin: 0.50      # 고정 안전 여유거리 (m)
    min_threshold: 1.0       # 최소 near threshold (m)
    max_threshold: 2.5       # 최대 near threshold (m)

# [최적화 2] Redis Hash 설정
# Stream에는 ref(hash key)만 발행, 실제 데이터는 Hash에 저장
result_hash:
  ttl: 5                     # Hash TTL (초) — stale 데이터 자동 삭제

# Go1 어안 카메라 내부 파라미터 (캘리브레이션 결과)
# UniDepth에 camera=K 전달용 — 실제 캘리브레이션 값으로 교체 필요
camera_intrinsics:
  enabled: true
  # 3×3 K 행렬 (fx, fy, cx, cy)
  fx: 285.0
  fy: 285.0
  cx: 232.0   # w_half / 2
  cy: 200.0   # h_total / 2

models:
  unidepth:
    model_name: /home/dg/capstone-db/image_server/checkpoints/unidepth-v2-vitb14
    infer_imgsz: [320, 240]

  finetune_detector:
    weight: /home/dg/capstone-db/image_server/best_finetune_train3.pt
    conf: 0.25
    imgsz: 320

  zeroshot_detector:
    weight: /home/dg/capstone-db/image_server/yolov8s-world.pt
    conf: 0.12
    imgsz: 320

fusion:
  iou: 0.45
  near_bonus: 0.15

