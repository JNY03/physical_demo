# 피지컬팀 mk2 — pi7 로컬 MQTT 브로커 설정
#   설치: sudo cp pi/deploy/mosquitto-hw.conf /etc/mosquitto/conf.d/hw.conf
#         sudo systemctl restart mosquitto
#
# 왜 로봇 옆(pi7)에 브로커를 두나
#   현장 네트워크가 핫스팟으로 자주 바뀐다. 브로커가 노트북에 있으면 노트북 IP가
#   바뀔 때마다 모든 말단의 설정을 고쳐야 하고, 노트북이 꺼지면 명령 경로 자체가 죽는다.
#   pi7 은 로봇과 같은 자리에 상시 켜져 있고 mDNS 이름(pi7.local)이 IP 변화와 무관하다.
#   ※ 아키텍처상 엣지 브로커는 엣지 노드가 맡는다 — 그 장비가 구축되면 그쪽으로 옮긴다.
#     (config.py 도 노트북 주소를 "임시"로 적어 두고 있다)
#
# ⚠ 여기에는 **기본 mosquitto.conf 에 없는 것만** 적는다. persistence/persistence_location/
#   log_dest 는 기본 설정에 이미 있고, mosquitto 는 그런 중복을 오류로 보고 기동을 거부한다
#   (실제로 "Duplicate persistence_location value" 로 죽었다).

# mosquitto 2.x 는 기본이 localhost 전용이라 명시적으로 열어야 외부(백엔드·Unity)가 붙는다.
listener 1883 0.0.0.0

# 인증은 아직 없다. BE-T-01 의 TLS/인증이 준비되면 여기에 붙인다
# (그 전까지는 현장망이 폐쇄망이라는 전제다 — 공개망에 그대로 두지 말 것).
allow_anonymous true

# 브라우저에서 직접 명령을 보내는 경로(관제 웹). 브라우저 JS 는 생 TCP 를 못 열어서
# 1883 으로는 못 붙는다 — MQTT over WebSocket 이 필요하다. 같은 브로커·같은 토픽이고
# 전송 계층만 다르다(말단·백엔드는 계속 1883 을 쓴다).
# ⚠ https 로 서비스되는 페이지에서는 ws:// 가 mixed content 로 차단된다. 웹을 http 로
#   띄우거나, 브로커에 TLS(wss)를 붙여야 한다 — 후자는 BE-T-01 인증서 준비 후.
listener 9001 0.0.0.0
protocol websockets

# 말단 keepalive 는 10초(config.KEEPALIVE). 상한을 넉넉히 둬 정상 연결이 끊기지 않게 한다.
max_keepalive 300
